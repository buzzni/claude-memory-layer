name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test the advertised support floor and current LTS.
        node-version: ['20', '22']
    env:
      # Skip the isolated embedding backend's postinstall network fetch in CI;
      # the development dependency still covers compile and unit-test imports.
      CLAUDE_MEMORY_LAYER_SKIP_EMBEDDING_POSTINSTALL: '1'
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Architecture import boundaries
        run: npm run check:architecture
